# Her "main" güncellemesinde Android APK'sını derler ve Releases sayfasına koyar.
# Sabit indirme bağlantısı: https://github.com/<kullanıcı>/<depo>/releases/latest/download/turkiye-gezi-rehberi.apk
name: Android APK

on:
  push:
    branches: [main]
    paths-ignore: ['web/**']
  workflow_dispatch:
    inputs:
      play:
        description: 'Google Play için imzalı AAB de üret (UPLOAD_KEYSTORE_* gizli değişkenleri gerekir)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Expo projesini hazırla
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/w" && cd "$RUNNER_TEMP/w"
          npx --yes create-expo-app@latest app --template blank-typescript --no-install
          cd app
          rm -rf App.tsx index.ts app.json assets
          cp -r "$GITHUB_WORKSPACE"/{App.tsx,index.ts,app.json,src,assets} .
          # sürüm numarasını her derlemede artır (telefonda güncelleme olarak kurulsun)
          node -e "const f='app.json',j=require('./'+f);j.expo.version='0.1.${{ github.run_number }}';j.expo.android.versionCode=${{ github.run_number }};require('fs').writeFileSync(f,JSON.stringify(j,null,2))"
          echo '{ "run": ${{ github.run_number }} }' > src/build.json
          npm install
          npx expo install @supabase/supabase-js @react-native-async-storage/async-storage react-native-url-polyfill react-native-safe-area-context expo-status-bar expo-image-picker expo-image-manipulator expo-location expo-speech expo-keep-awake react-native-svg react-native-view-shot expo-sharing expo-notifications expo-font expo-file-system expo-intent-launcher
          npm install @maplibre/maplibre-react-native@^11.3.3 base64-arraybuffer
          npm install -D @types/geojson
          # telefona bildirim: Firebase ayar dosyası GitHub gizli değişkeninden gelir (yoksa bildirimsiz derlenir)
          if [ -n "${GOOGLE_SERVICES_JSON:-}" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > google-services.json
            node -e "const g=require('./google-services.json');const ok=(g.client||[]).some(c=>c.client_info&&c.client_info.android_client_info&&c.client_info.android_client_info.package_name==='com.turkiyegezirehberi.app');if(!ok){console.log('::error title=Firebase::google-services.json içinde com.turkiyegezirehberi.app paket adı yok');process.exit(1)}console.log('Firebase ayar dosyası tamam: proje '+g.project_info.project_id)"
            node -e "const f='app.json',j=require('./'+f);j.expo.android.googleServicesFile='./google-services.json';require('fs').writeFileSync(f,JSON.stringify(j,null,2))"
          else
            echo "::warning title=Firebase::GOOGLE_SERVICES_JSON yok, telefona bildirim olmadan derleniyor"
          fi
          echo "APP_DIR=$PWD" >> "$GITHUB_ENV"

      - name: Kod denetimi (TypeScript)
        working-directory: ${{ env.APP_DIR }}
        run: |
          npx tsc --noEmit --pretty false > tsc.txt 2>&1 || true
          n=$(grep -c "error TS" tsc.txt || true)
          echo "TypeScript hata sayısı: $n"
          if [ "$n" != "0" ]; then
            grep "error TS" tsc.txt | head -40 | paste -sd'|' | fold -w 3500 | head -9 | while IFS= read -r l; do echo "::warning title=TS ($n)::$l"; done
          fi

      - name: Android projesini üret
        working-directory: ${{ env.APP_DIR }}
        run: npx expo prebuild --platform android --no-install

      - name: APK derle
        working-directory: ${{ env.APP_DIR }}/android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      # Google Play: yükleme anahtarıyla imzalı .aab (yalnızca elle başlatılınca ve play seçilince)
      - name: Play paketi (AAB) derle
        if: github.event_name == 'workflow_dispatch' && inputs.play
        working-directory: ${{ env.APP_DIR }}/android
        env:
          UPLOAD_KEYSTORE_B64: ${{ secrets.UPLOAD_KEYSTORE_B64 }}
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${UPLOAD_KEYSTORE_B64:-}" ]; then echo "::error title=Play::UPLOAD_KEYSTORE_B64 gizli değişkeni yok"; exit 1; fi
          printf '%s' "$UPLOAD_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          export UPLOAD_STORE_FILE="$RUNNER_TEMP/upload.jks"
          node -e "
            const fs=require('fs'),f='app/build.gradle';let g=fs.readFileSync(f,'utf8');
            g=g.replace(/signingConfigs\s*\{/, m=>m+'\n        upload { storeFile file(System.getenv(\'UPLOAD_STORE_FILE\')); storePassword System.getenv(\'UPLOAD_KEYSTORE_PASSWORD\'); keyAlias System.getenv(\'UPLOAD_KEY_ALIAS\'); keyPassword System.getenv(\'UPLOAD_KEY_PASSWORD\') }');
            const i=g.indexOf('release {', g.indexOf('buildTypes'));
            g=g.slice(0,i)+g.slice(i).replace('signingConfig signingConfigs.debug','signingConfig signingConfigs.upload');
            fs.writeFileSync(f,g);"
          # Play sürümü: uygulama içi APK güncellemesi kapalı (Play politikası) — izin kaldırılır, buton Play Store'u açar
          echo '{ "run": ${{ github.run_number }}, "store": "play" }' > "$APP_DIR/src/build.json"
          sed -i '/android.permission.REQUEST_INSTALL_PACKAGES/d' app/src/main/AndroidManifest.xml
          if grep -q REQUEST_INSTALL_PACKAGES app/src/main/AndroidManifest.xml; then echo "::error title=Play::REQUEST_INSTALL_PACKAGES kaldırılamadı"; exit 1; fi
          ./gradlew bundleRelease --no-daemon
          cp app/build/outputs/bundle/release/app-release.aab "$GITHUB_WORKSPACE/turkiye-gezi-rehberi.aab"
          rm -f "$RUNNER_TEMP/upload.jks"

      - name: Play paketini sakla
        if: github.event_name == 'workflow_dispatch' && inputs.play
        uses: actions/upload-artifact@v4
        with:
          name: turkiye-gezi-rehberi-play
          path: turkiye-gezi-rehberi.aab
          retention-days: 30

      - name: APK'yı adlandır
        run: cp "$APP_DIR/android/app/build/outputs/apk/release/app-release.apk" turkiye-gezi-rehberi.apk

      # main dışındaki dallar (deneme derlemesi): sürüm yayınlanmaz, telefona güncelleme bildirimi gitmez
      - name: Deneme derlemesini sakla
        if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: turkiye-gezi-rehberi-deneme
          path: turkiye-gezi-rehberi.apk
          retention-days: 7

      - name: Releases sayfasına koy
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: Türkiye Gezi Rehberi 0.1.${{ github.run_number }}
          body: |
            Telefonuna kurmak için aşağıdaki **turkiye-gezi-rehberi.apk** dosyasına dokun.
            Değişiklik: ${{ github.event.head_commit.message }}
          files: turkiye-gezi-rehberi.apk
          make_latest: true
